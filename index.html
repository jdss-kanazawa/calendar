*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;

.wrap{max-width:1100px; margin:0 auto; padding:12px 16px 24px;}
h1{font-size:1.5rem; font-weight:700; margin:4px 0 2px;}
.note{font-size:.8rem; color:var(--sub); margin-bottom:8px;}
/* month nav */
.mnav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 10px;}
.mnav button.nav{border:1px solid var(--border); background:var(--soft); border-radius:8px;
  min-width:44px; min-height:36px; font-size:1rem; cursor:pointer; color:var(--text);}
.mtabs{display:flex; gap:6px; flex-wrap:wrap;}
.mtab{border:1px solid var(--border); background:#fff; border-radius:8px; padding:5px 12px;
  font-size:.85rem; cursor:pointer; color:var(--sub); min-height:36px;}
.mtab.active{background:var(--text); color:#fff; border-color:var(--text); font-weight:600;}
/* legend */
.legend{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
.legrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.leglabel{font-size:.75rem; color:var(--sub); min-width:2.6em;}
.chip{display:inline-flex; align-items:center; gap:4px; border-radius:6px; padding:2px 8px;
  font-size:.78rem; cursor:pointer; border:1px solid transparent; min-height:26px; user-select:none;}
.chip .dot{width:9px; height:9px; border-radius:3px; display:inline-block;}
.chip.off{opacity:.32; text-decoration:line-through;}
.chip.cat{font-weight:600;}
.chip.tgt{background:#fff; border-width:1.5px; border-style:solid;}

body.land #calView{display:block;}
body.land #listView{display:none;}
#listView{display:block;}

.cell.today{box-shadow:inset 0 0 0 2px var(--text);}

.bar.bstart{margin-left:2px;}
.bar.bend{margin-right:2px;}
.barname{font-size:.62rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; padding:0 1px;}
.ev{border-radius:6px; padding:2px 5px; font-size:.72rem; line-height:1.35; cursor:pointer;

.ev .tm{font-weight:700; margin-right:3px;}
.ev .nm{font-weight:600; display:block; overflow:hidden; text-overflow:ellipsis;}
.ev .lc{color:var(--sub); font-size:.66rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ev.koen{font-size:.85rem; border-width:2.5px; padding:4px 7px;}
.ev.koen .nm{font-size:.92rem;}
.ev.koen .lc{font-size:.72rem;}
/* list view */
.dayblock{display:flex; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden; background:#fff;}
.pbar{flex:0 0 30px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;

.pbar .vlabel{writing-mode:vertical-rl; font-size:.62rem; font-weight:700; letter-spacing:.05em;}
.pbar .vname{writing-mode:vertical-rl; font-size:.68rem; max-height:120px; overflow:hidden;}
.dhead{flex:0 0 64px; background:var(--soft); padding:8px 4px; text-align:center; border-right:1px solid var(--border);}

.lev .tm{font-weight:700; margin-right:5px;}
.lev .nm{font-weight:600;}

.lev.koen{border-width:2.5px; font-size:.95rem; padding:7px 11px;}
.lev.koen .nm{font-size:1rem;}
.noev{color:#B9B6B1; font-size:.75rem; padding:2px 0;}

.foot a{color:var(--c-jishibu);}
.upd{text-align:right; font-size:.68rem; color:#B9B6B1; margin-top:6px;}

#overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding:16px; z-index:50;}
#overlay.on{display:flex;}
#modal{background:#fff; border-radius:12px; max-width:480px; width:100%; max-height:85vh; overflow:auto; padding:18px 20px;}

#modal .lbl{color:var(--sub); font-size:.72rem; margin-right:6px;}

#mclose{margin-top:12px; width:100%; min-height:44px; border:1px solid var(--border); background:var(--soft); border-radius:8px; font-size:.9rem; cursor:pointer;}
.tagchip{display:inline-block; border-radius:6px; padding:1px 8px; font-size:.75rem; font-weight:600; border:1px solid; margin-right:4px;}
@media (max-width:520px){

  .cell{min-height:64px;}

</style>

const HAISHIN_WORD = /(オンライン|Zoom|zoom|配信|LINE|ＬＩＮＥ)/;
const WK = ["月","火","水","木","金","土","日"];
const offCats = new Set(), offTgts = new Set();
let curMonth = CUR_MONTH;

const esc = s => String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const catOf = n => CATS.find(c=>c.name===n) || {name:n,c:"#8A8781",bg:"#F0EFED"};
const tgtOf = n => TGTS.find(t=>t.name===n) || {name:n,c:"#8A8781"};
const dObj = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
const spanDays = e => Math.round((dObj(e.e)-dObj(e.s))/86400000)+1;
const isPeriod = e => spanDays(e)>=3;
function placeInfo(e){
  let p = e.p || "";
  if(e.stt && p && !HAISHIN_WORD.test(p)) p += "（配信）";
  if(!p && e.stt) p = "配信";
  const icon = (e.stt || HAISHIN_WORD.test(p)) ? "📡" : "🏫";
  return {p, icon};
}
function mdLabel(s){ const [,m,d]=s.split("-"); return `${Number(m)}/${Number(d)}`; }
function wkLabel(s){ return WK[(dObj(s).getDay()+6)%7]; }
const tkey = e => e.st ? parseInt(e.st.split(":")[0])*60 + parseInt(e.st.split(":")[1]) : -1;
const byTime = (a,b) => tkey(a)-tkey(b) || a.t.localeCompare(b.t);
function visible(e){ return !offCats.has(e.c) && !(e.g && offTgts.has(e.g)); }

/* ---- legend ---- */
function renderLegend(){
  const L = document.getElementById("legend");
  L.innerHTML = "";
  const r1 = document.createElement("div"); r1.className="legrow";
  r1.innerHTML = '<span class="leglabel">分類</span>';
  CATS.forEach(c=>{
    const b=document.createElement("span");
    b.className="chip cat"+(offCats.has(c.name)?" off":"");
    b.style.background=c.bg; b.style.color=c.c; b.style.borderColor=c.c;
    b.innerHTML=`<span class="dot" style="background:${c.c}"></span>${esc(c.name)}`;
    b.onclick=()=>{ offCats.has(c.name)?offCats.delete(c.name):offCats.add(c.name); renderAll(); };
    r1.appendChild(b);
  });
  const r2 = document.createElement("div"); r2.className="legrow";
  r2.innerHTML = '<span class="leglabel">対象</span>';
  TGTS.filter(t=>EVENTS.some(e=>e.g===t.name)).forEach(t=>{
    const b=document.createElement("span");
    b.className="chip tgt"+(offTgts.has(t.name)?" off":"");
    b.style.borderColor=t.c; b.style.color=t.c;
    b.textContent=t.name;
    b.onclick=()=>{ offTgts.has(t.name)?offTgts.delete(t.name):offTgts.add(t.name); renderAll(); };
    r2.appendChild(b);
  });
  L.appendChild(r1); L.appendChild(r2);
}

/* ---- month tabs ---- */
const MONTHS = [...new Set(EVENTS.map(e=>e.s.slice(0,7)))].sort();
function renderTabs(){
  const T=document.getElementById("mtabs"); T.innerHTML="";
  MONTHS.forEach(m=>{
    const b=document.createElement("button");
    b.className="mtab"+(m===curMonth?" active":"");
    const yy=m.slice(0,4); b.textContent = yy==="2026" ? `${Number(m.slice(5))}月` : `${yy.slice(2)}年${Number(m.slice(5))}月`;
    b.onclick=()=>{ curMonth=m; renderAll(); };
    T.appendChild(b);
  });
}
function shiftMonth(d){
  const i=MONTHS.indexOf(curMonth)+d;
  if(i>=0 && i<MONTHS.length){ curMonth=MONTHS[i]; renderAll(); }
}
document.getElementById("prevM").onclick=()=>shiftMonth(-1);
document.getElementById("nextM").onclick=()=>shiftMonth(1);

/* ---- cards ---- */
function cardHTML(e, label, timestr){
  const c=catOf(e.c), koen=e.c==="ご講演";
  const {p,icon}=placeInfo(e);
  const t = timestr ? `<span class="tm">${esc(timestr)}</span>` : "";
  const loc = p ? `<span class="lc">${icon}${esc(p)}${e.pd?"　"+esc(e.pd):""}</span>` : (e.pd?`<span class="lc">${esc(e.pd)}</span>`:"");
  return `<div class="ev${koen?" koen":""}" data-i="${e.i}" style="background:${c.bg};border-color:${c.c};color:${c.c}">${t}<span class="nm">${esc(label||e.t)}</span>${loc}</div>`;
}
function labelFor(e, day){
  const span=spanDays(e);
  if(span<=1) return {label:e.t, time:e.st?`${e.st}〜${e.et||""}`.replace(/〜$/,""):null};
  if(span===2){
    if(day===e.s) return {label:e.t+"（初日）", time:e.st?`${e.st}〜`:null};
    if(day===e.e) return {label:e.t+"（最終日）", time:e.et?`〜${e.et}`:null};
  }
  return null;
}

/* ---- calendar ---- */
const TODAY = "2026-08-29";
function renderCal(){
  const G=document.getElementById("grid"); G.innerHTML="";
  const D=document.getElementById("dowrow");
  if(!D.children.length) WK.forEach((w,i)=>{ const x=document.createElement("div"); x.className="dow"+(i===6?" sun":""); x.textContent=w; D.appendChild(x); });
  const [y,m]=curMonth.split("-").map(Number);
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const lead=(first.getDay()+6)%7;
  const cells=[];
  for(let i=0;i<lead;i++){ const d=new Date(first); d.setDate(d.getDate()-(lead-i)); cells.push({d,dim:true}); }
  for(let d=1; d<=last.getDate(); d++) cells.push({d:new Date(y,m-1,d),dim:false});
  while(cells.length%7!==0){ const d=new Date(cells[cells.length-1].d); d.setDate(d.getDate()+1); cells.push({d,dim:true}); }
  const byDay={};
  cells.forEach(c=>{ byDay[iso(c.d)]=[]; });
  EVENTS.forEach(e=>{ if(!visible(e)) return;
    if(isPeriod(e)) return;
    if(spanDays(e)===2){
      [e.s,e.e].forEach(day=>{ if(byDay[day]) byDay[day].push(e); });
    } else if(byDay[e.s]) byDay[e.s].push(e);
  });
  cells.forEach(c=>{
    const key=iso(c.d);
    const cell=document.createElement("div");
    cell.className="cell"+(c.dim?" dim":"")+(key===TODAY?" today":"");
    cell.innerHTML=`<div class="dnum">${c.dim?(c.d.getMonth()+1)+"/":""}${c.d.getDate()}</div>`;
    /* period bars */
    EVENTS.filter(e=>isPeriod(e)&&visible(e)&&e.s<=key&&key<=e.e).forEach(e=>{
      const cc=catOf(e.c);
      const bar=document.createElement("div");
      bar.className="bar"+(e.s===key?" bstart":"")+(e.e===key?" bend":"");
      bar.style.background=cc.c; bar.dataset.i=e.i;
      cell.appendChild(bar);
      if(e.s===key || c.d.getDay()===1){
        const nm=document.createElement("div");
        nm.className="barname"; nm.style.color=cc.c; nm.dataset.i=e.i;
        nm.textContent=`${e.t}（${mdLabel(e.s)}〜${mdLabel(e.e)}）`;
        cell.appendChild(nm);
      }
    });
    byDay[key].sort(byTime).forEach(e=>{
      const lf=labelFor(e,key)||{label:e.t,time:e.st};
      const div=document.createElement("div");
      div.innerHTML=cardHTML(e,lf.label,lf.time);
      cell.appendChild(div.firstChild);
    });
    G.appendChild(cell);
  });
}

/* ---- list ---- */
function renderList(){
  const L=document.getElementById("listView"); L.innerHTML="";
  const [y,m]=curMonth.split("-").map(Number);
  const last=new Date(y,m,0).getDate();
  const todayKey=TODAY;
  for(let d=1; d<=last; d++){
    const key=iso(new Date(y,m-1,d));
    const evs=EVENTS.filter(e=>visible(e)&&!isPeriod(e)&&(spanDays(e)===2?(e.s===key||e.e===key):e.s===key))
      .sort(byTime);
    const pers=EVENTS.filter(e=>isPeriod(e)&&visible(e)&&e.s<=key&&key<=e.e);
    if(!evs.length && !pers.length) continue;
    const blk=document.createElement("div"); blk.className="dayblock";
    pers.forEach(e=>{
      const cc=catOf(e.c);
      const st = (todayKey>=e.s && todayKey<=e.e) ? "開催中" : "開催予定";
      const pb=document.createElement("div");
      pb.className="pbar"; pb.style.background=cc.bg; pb.style.color=cc.c; pb.dataset.i=e.i;
      pb.innerHTML=`<span class="vlabel">${st}</span><span class="vname">${esc(e.t)} ${mdLabel(e.s)}〜${mdLabel(e.e)}</span>`;
      blk.appendChild(pb);
    });
    const w=wkLabel(key), sun=dObj(key).getDay()===0;
    const body=document.createElement("div");
    blk.insertAdjacentHTML("beforeend",
      `<div class="dhead"><div class="md">${m}/${d}</div><div class="wk${sun?" sun":""}">${w}</div></div>`);
    body.className="dbody";
    evs.forEach(e=>{
      const lf=labelFor(e,key)||{label:e.t,time:e.st};
      const c=catOf(e.c), koen=e.c==="ご講演";
      const {p,icon}=placeInfo(e);
      const g=e.g?`<span class="tagchip" style="color:${tgtOf(e.g).c};border-color:${tgtOf(e.g).c}">${esc(e.g)}</span>`:"";
      const div=document.createElement("div");
      div.className="lev"+(koen?" koen":"");
      div.style.background=c.bg; div.style.borderColor=c.c; div.style.color=c.c;
      div.dataset.i=e.i;
      div.innerHTML=`${lf.time?`<span class="tm">${esc(lf.time)}</span>`:""}<span class="nm">${esc(lf.label)}</span>`+
        `<div class="meta">${g}${p?` ${icon}${esc(p)}${e.pd?"　"+esc(e.pd):""}`:(e.pd?esc(e.pd):"")}</div>`;
      body.appendChild(div);
    });
    if(!evs.length) body.innerHTML='<div class="noev">行事カードなし（期間行事のみ）</div>';
    blk.appendChild(body);
    L.appendChild(blk);
  }
  if(!L.children.length) L.innerHTML='<div class="noev">この月の行事はありません</div>';
}

/* ---- modal ---- */
const OV=document.getElementById("overlay"), MD=document.getElementById("modal");
function openModal(idx){
  const e=EVENTS.find(x=>x.i===idx); if(!e) return;
  const c=catOf(e.c), {p,icon}=placeInfo(e);
  const span=spanDays(e);
  let when;
  if(span===1) when=`${mdLabel(e.s)}（${wkLabel(e.s)}）`+(e.st?` ${e.st}〜${e.et||""}`.replace(/〜$/,""):"");
  else when=`${mdLabel(e.s)}（${wkLabel(e.s)}）〜${mdLabel(e.e)}（${wkLabel(e.e)}）`+
    (e.st?`　${e.s===e.e?"":"初日 "+e.st+"〜"}`:"")+(e.et?` 最終日 〜${e.et}`:"");
  MD.innerHTML=`<h2>${esc(e.t)}</h2>`+
    `<div class="row"><span class="tagchip" style="background:${c.bg};color:${c.c};border-color:${c.c}">${esc(e.c)}</span>`+
    (e.g?`<span class="tagchip" style="color:${tgtOf(e.g).c};border-color:${tgtOf(e.g).c}">${esc(e.g)}</span>`:"")+`</div>`+
    `<div class="row"><span class="lbl">日時</span>${esc(when)}</div>`+
    (p?`<div class="row"><span class="lbl">場所</span>${icon} ${esc(p)}${e.pd?"　"+esc(e.pd):""}</div>`:(e.pd?`<div class="row"><span class="lbl">場所</span>${esc(e.pd)}</div>`:""))+
    (e.ha&&e.ha.length?`<div class="row"><span class="lbl">担当</span>${esc(e.ha.join("、"))}</div>`:"")+
    (e.d?`<div class="row"><span class="lbl">説明</span>${esc(e.d).replace(/\n/g,"<br>")}</div>`:"")+
    (e.u?`<div class="row"><span class="lbl">URL</span><a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.u)}</a></div>`:"")+
    `<button id="mclose">閉じる</button>`;
  OV.classList.add("on");
  document.getElementById("mclose").onclick=()=>OV.classList.remove("on");
}
OV.onclick=ev=>{ if(ev.target===OV) OV.classList.remove("on"); };
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-i]");
  if(t) openModal(Number(t.dataset.i));
});

/* ---- orientation ---- */
function applyOrientation(){
  const land=window.matchMedia("(orientation: landscape)").matches;
  document.body.classList.toggle("land",land);
}
window.matchMedia("(orientation: landscape)").addEventListener("change",applyOrientation);

function renderAll(){ renderLegend(); renderTabs(); renderCal(); renderList(); }
applyOrientation(); renderAll();
</script>
</body>
</html>
