<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青年部金沢地区の日程表</title>
<style>
:root{
  --text:#2C2C2B; --sub:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7; --soft2:#F0EFED; --border:#E6E5E3;
  --c-koen:#E56458; --c-koen-bg:#FCE9E7;
  --c-jishibu:#2783DE; --c-jishibu-bg:#E5F2FC;
  --c-kyotsu:#46A171; --c-kyotsu-bg:#E8F1EC;
  --c-tashibu:#8A8781; --c-tashibu-bg:#F0EFED;
  --g-purple:#8E6BC0; --g-green:#46A171; --g-blue:#2783DE; --g-gray:#8A8781; --g-red:#E56458; --g-amber:#C08A1F;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  color:var(--text); background:var(--canvas); line-height:1.5;}
.wrap{max-width:1100px; margin:0 auto; padding:12px 16px 24px;}
h1{font-size:1.5rem; font-weight:700; margin:4px 0 2px;}
.note{font-size:.8rem; color:var(--sub); margin-bottom:8px;}
/* month nav */
.mnav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 10px;}
.mnav button.nav{border:1px solid var(--border); background:var(--soft); border-radius:8px;
  min-width:44px; min-height:36px; font-size:1rem; cursor:pointer; color:var(--text);}
.mtabs{display:flex; gap:6px; flex-wrap:wrap;}
.mtab{border:1px solid var(--border); background:#fff; border-radius:8px; padding:5px 12px;
  font-size:.85rem; cursor:pointer; color:var(--sub); min-height:36px;}
.mtab.active{background:var(--text); color:#fff; border-color:var(--text); font-weight:600;}
/* legend */
.legend{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
.legrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.leglabel{font-size:.75rem; color:var(--sub); min-width:2.6em;}
.chip{display:inline-flex; align-items:center; gap:4px; border-radius:6px; padding:2px 8px;
  font-size:.78rem; cursor:pointer; border:1px solid transparent; min-height:26px; user-select:none;}
.chip .dot{width:9px; height:9px; border-radius:3px; display:inline-block;}
.chip.off{opacity:.32; text-decoration:line-through;}
.chip.cat{font-weight:600;}
.chip.tgt{background:#fff; border-width:1.5px; border-style:solid;}
/* calendar */
#calView{display:none;}
body.land #calView{display:block;}
body.land #listView{display:none;}
#listView{display:block;}
body.land #listView{display:none;}
.dowrow{display:grid; grid-template-columns:repeat(7,1fr); border-left:1px solid var(--border); border-top:1px solid var(--border);}
.dow{border-right:1px solid var(--border); padding:3px 0; text-align:center; font-size:.75rem; font-weight:600; color:var(--sub); background:var(--soft);}
.dow.sun{color:#C0433B;}
.grid{display:grid; grid-template-columns:repeat(7,1fr); border-left:1px solid var(--border);}
.cell{border-right:1px solid var(--border); border-bottom:1px solid var(--border); min-height:96px;
  padding:2px 3px 4px; display:flex; flex-direction:column; gap:2px; background:#fff; overflow:hidden;}
.cell.dim{background:var(--soft);}
.cell.dim .dnum{color:#B9B6B1;}
.dnum{font-size:.78rem; font-weight:700; color:var(--text); padding:0 2px;}
.cell.today .dnum{background:var(--text); color:#fff; border-radius:6px; display:inline-block; padding:0 5px;}
.cell.today{box-shadow:inset 0 0 0 2px var(--text);}
.bar{height:5px; border-radius:3px; margin:1px -4px; cursor:pointer; position:relative;}
.bar.bstart{margin-left:2px;}
.bar.bend{margin-right:2px;}
.barname{font-size:.62rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; padding:0 1px;}
.ev{border-radius:6px; padding:2px 5px; font-size:.72rem; line-height:1.35; cursor:pointer;
  border:1px solid; overflow:hidden;}
.ev .tm{font-weight:700; margin-right:3px;}
.ev .nm{font-weight:600; display:block; overflow:hidden; text-overflow:ellipsis;}
.ev .tg{display:inline-block; background:#fff; border:1px solid; border-radius:4px; padding:0 3px; font-size:.6rem; margin-left:3px; line-height:1.3; vertical-align:middle;}
.ev .lc{color:var(--sub); font-size:.66rem; display:block; white-space:normal; overflow-wrap:anywhere;}
.ev.koen{font-size:.85rem; border-width:2.5px; padding:4px 7px;}
.ev.koen .nm{font-size:.92rem;}
.ev.koen .lc{font-size:.72rem;}
/* list view */
.dayblock{display:flex; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden; background:#fff;}
.pbar{flex:0 0 30px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  cursor:pointer; padding:6px 0;}
.pbar .vlabel{writing-mode:vertical-rl; font-size:.62rem; font-weight:700; letter-spacing:.05em;}
.pbar .vname{writing-mode:vertical-rl; font-size:.68rem; max-height:120px; overflow:hidden;}
.dhead{flex:0 0 64px; background:var(--soft); padding:8px 4px; text-align:center; border-right:1px solid var(--border);}
.dhead .md{font-size:.95rem; font-weight:700;}
.dhead .wk{font-size:.7rem; color:var(--sub);}
.dhead .wk.sun{color:#C0433B;}
.dbody{flex:1; padding:6px 8px; display:flex; flex-direction:column; gap:5px;}
.lev{border:1px solid; border-radius:8px; padding:5px 9px; cursor:pointer; font-size:.85rem;}
.lev .tm{font-weight:700; margin-right:5px;}
.lev .nm{font-weight:600;}
.lev .meta{font-size:.72rem; color:var(--sub); margin-top:1px;}
.lev.koen{border-width:2.5px; font-size:.95rem; padding:7px 11px;}
.lev.koen .nm{font-size:1rem;}
.noev{color:#B9B6B1; font-size:.75rem; padding:2px 0;}
/* footer */
.foot{margin-top:16px; padding-top:12px; border-top:1px solid var(--border); font-size:.85rem;}
.foot a{color:var(--c-jishibu);}
.upd{text-align:right; font-size:.68rem; color:#B9B6B1; margin-top:6px;}
/* modal */
#overlay{position:absolute; inset:0; background:rgba(0,0,0,.35); display:none; z-index:50;}
#overlay.on{display:block;}
#modal{position:absolute; left:50%; transform:translateX(-50%); background:#fff; border-radius:12px; max-width:480px; width:calc(100% - 32px); padding:18px 20px; box-shadow:0 10px 40px rgba(0,0,0,.3);}
#modal h2{font-size:1.1rem; margin-bottom:8px; line-height:1.4;}
#modal .row{font-size:.85rem; margin:5px 0;}
#modal .lbl{color:var(--sub); font-size:.72rem; margin-right:6px;}
#modal a{color:var(--c-jishibu); word-break:break-all;}
#mclose{margin-top:12px; width:100%; min-height:44px; border:1px solid var(--border); background:var(--soft); border-radius:8px; font-size:.9rem; cursor:pointer;}
.tagchip{display:inline-block; border-radius:6px; padding:1px 8px; font-size:.75rem; font-weight:600; border:1px solid; margin-right:4px;}
@media (max-width:520px){
  .mnav{gap:4px} .mtabs{gap:3px} .mtab{padding:5px 7px}
  h1{font-size:1.2rem;}
  .cell{min-height:64px;}
  /* スマホではポップアップを幅いっぱい・文字を大きくして見やすく */
  #modal{max-width:none; width:calc(100% - 20px); padding:20px 18px;}
  #modal h2{font-size:1.3rem; line-height:1.45; margin-bottom:12px;}
  #modal .row{font-size:1.05rem; margin:9px 0; line-height:1.6;}
  #modal .lbl{font-size:.9rem;}
  #modal a{font-size:1.02rem;}
  #mclose{min-height:50px; font-size:1.05rem; margin-top:18px;}
  .tagchip{font-size:.92rem; padding:2px 10px;}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>青年部金沢地区の日程表</h1>
  <div class="note">下の「分類」「対象」のラベルをクリックすると、該当する行事の表示／非表示を切り替えられます。</div>
  <div class="legend" id="legend"></div>
  <div class="mnav">
    <button class="nav" id="prevM" aria-label="前の月">◀</button>
    <div class="mtabs" id="mtabs"></div>
    <button class="nav" id="nextM" aria-label="次の月">▶</button>
  </div>
  <div id="calView">
    <div class="dowrow" id="dowrow"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="listView"></div>
  <div class="foot">
    青年一般向け勉強会の詳細を知りたい方はこちらを参照してください<br>
    <a href="https://www.kokuchpro.com/group/kanazawabuddhism/" target="_blank" rel="noopener">ベル・クルール〜Belle Couleur - こくちーず</a>
    <div class="upd" id="lastUpdated"></div>
  </div>
</div>
<div id="overlay"><div id="modal"></div></div>
<!-- ============================================================ -->
<!-- 1. イベントデータの読み込み                                  -->
<!-- JSONファイルを読み込み、ブラウザのメモリ上で画面を生成する     -->
<!-- ============================================================ -->
<script>
/**
 * @typedef {Object} CalendarEvent
 * @property {string} s 開始日（YYYY-MM-DD）
 * @property {string} e 終了日（YYYY-MM-DD）
 * @property {string} st 開始時刻（HH:mm、未設定時は空文字）
 * @property {string} et 終了時刻（HH:mm、未設定時は空文字）
 * @property {string} t 表示用行事名
 * @property {string} ot 正式な行事名
 * @property {string} c 分類
 * @property {string} g 対象
 * @property {string} p 場所
 * @property {string} pd 場所の詳細
 * @property {boolean} stt 配信行事かどうか
 * @property {string[]} ha 担当者一覧
 * @property {string} d 説明
 * @property {string} u 関連URL
 * @property {number} [i] 描画時に使う行事番号
 */
/**
 * @typedef {Object} CalendarData
 * @property {string} lastUpdated 最終更新日時
 * @property {CalendarEvent[]} events 行事一覧
 */
/**
 * @typedef {Object} CategoryStyle
 * @property {string} name 分類名
 * @property {string} c 文字・境界線の色
 * @property {string} bg 背景色
 */
/**
 * @typedef {Object} TargetStyle
 * @property {string} name 対象名
 * @property {string} c 文字・境界線の色
 */
/** @type {CalendarEvent[]} */
let EVENTS = [];
/** @type {string} */
let LAST_UPDATED = "";
</script>

<!-- ============================================================ -->
<!-- 2. カレンダー・リスト画面の制御プログラム                        -->
<!-- ============================================================ -->
<script>
// ============================================================
// 【起動処理】データの初期化と初期描画
// ============================================================
function __boot() {
  // JSON読み込みが完了してからフッターへ最終更新時刻を反映する。
  // ファイルが古い、または読み込みに失敗した場合でも空欄にするだけで画面描画は継続する。
  if (LAST_UPDATED) {
    const updEl = document.getElementById("lastUpdated");
    if (updEl) updEl.textContent = "最終更新: " + LAST_UPDATED;
  }
  // イベントデータから存在する「年月（YYYY-MM）」のリストを算出
  MONTHS = [...new Set(EVENTS.map(e => e.s.slice(0, 7)))].sort();
  // 画面の幅に応じた表示モード（リスト / カレンダー）の適用
  applyOrientation();
  // 画面全体の描画実行
  renderAll();
}

// 初期表示月は固定値ではなく、ブラウザの現在日時を日本時間として毎回算出する。
// GitHub Pages上のファイル更新時刻とは無関係に、ユーザーがページを開いた時点の当月を選ぶ。
/** @returns {string} 日本時間の年月（YYYY-MM） */
function getCurrentJstMonth() {
  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
  }).formatToParts(new Date());
  const getPart = type => parts.find(p => p.type === type)?.value || "";
  return `${getPart("year")}-${getPart("month")}`;
}
let curMonth = getCurrentJstMonth();
// ============================================================
// 【マスタ定義】分類・対象・配色設定
// ============================================================
// 分類（ご講演、自支部／青年、共通、他支部）と背景色・文字色
/** @type {CategoryStyle[]} */
const CATS = [
  {name:"ご講演",   c:"#E56458", bg:"#FCE9E7"},
  {name:"自支部／青年", c:"#2783DE", bg:"#E5F2FC"},
  {name:"共通",     c:"#46A171", bg:"#E8F1EC"},
  {name:"他支部",   c:"#8A8781", bg:"#F0EFED"},
];
// 対象（班長以上、学徒全員、縁正含む など）と枠線の色
/** @type {TargetStyle[]} */
const TGTS = [
  {name:"副地区長以上", c:"#8E6BC0"},
  {name:"会計以上",   c:"#46A171"},
  {name:"大班長以上",  c:"#8E6BC0"},
  {name:"班長以上",   c:"#2783DE"},
  {name:"学徒全員",   c:"#8A8781"},
  {name:"縁正含む",   c:"#E56458"},
  {name:"希望者（講）", c:"#C08A1F"},
];
const HAISHIN_WORD = /(オンライン|Zoom|zoom|配信|LINE|ＬＩＮＥ)/;
const WK = ["月","火","水","木","金","土","日"];
const offCats = new Set(), offTgts = new Set();

const esc = s => String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"'"}[m]));
/** @param {string} n @returns {CategoryStyle} */
const catOf = n => CATS.find(c=>c.name===n) || {name:n,c:"#8A8781",bg:"#F0EFED"};
/** @param {string} n @returns {TargetStyle} */
const tgtOf = n => TGTS.find(t=>t.name===n) || {name:n,c:"#8A8781"};
/** @param {string} s YYYY-MM-DD形式の日付 @returns {Date} */
const dObj = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
/** @param {Date} dt @returns {string} YYYY-MM-DD形式の日付 */
const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
/** @param {CalendarEvent} e @returns {number} 行事の日数 */
const spanDays = e => Math.round((dObj(e.e)-dObj(e.s))/86400000)+1;
/** @param {CalendarEvent} e @returns {boolean} 3日以上の期間行事かどうか */
const isPeriod = e => spanDays(e)>=3;
/**
 * @param {CalendarEvent} e
 * @returns {{p: string, icon: string}} 表示用の場所とアイコン
 */
function placeInfo(e){
  let p = e.p || "";
  if(e.stt && p && !HAISHIN_WORD.test(p)) p += "（配信）";
  if(!p && e.stt) p = "配信";
  const icon = (e.stt || HAISHIN_WORD.test(p)) ? "📡" : "🏫";
  return {p, icon};
}
/** @param {string} s YYYY-MM-DD形式の日付 @returns {string} M/D形式の日付 */
function mdLabel(s){ const [,m,d]=s.split("-"); return `${Number(m)}/${Number(d)}`; }
/** @param {string} s YYYY-MM-DD形式の日付 @returns {string} 曜日の一文字表記 */
function wkLabel(s){ return WK[(dObj(s).getDay()+6)%7]; }
/** @param {CalendarEvent} e @returns {number} 開始時刻を分にした値 */
const tkey = e => e.st ? parseInt(e.st.split(":")[0])*60 + parseInt(e.st.split(":")[1]) : -1;
/** @param {CalendarEvent} a @param {CalendarEvent} b @returns {number} 時刻順の比較結果 */
const byTime = (a,b) => tkey(a)-tkey(b) || a.t.localeCompare(b.t);
/** @param {CalendarEvent} e @returns {boolean} 分類・対象フィルターを通過するかどうか */
function visible(e){ return !offCats.has(e.c) && !(e.g && offTgts.has(e.g)); }

// ============================================================
// 【凡例】画面上部の「分類」「対象」フィルタチップの描画
// ============================================================
function renderLegend(){
  const L = document.getElementById("legend");
  L.innerHTML = "";
  const r1 = document.createElement("div"); r1.className="legrow";
  r1.innerHTML = '<span class="leglabel">分類</span>';
  CATS.filter(c=>EVENTS.some(e=>e.c===c.name)).forEach(c=>{
    const b=document.createElement("span");
    b.className="chip cat"+(offCats.has(c.name)?" off":"");
    b.style.background=c.bg; b.style.color=c.c; b.style.borderColor=c.c;
    b.innerHTML=`<span class="dot" style="background:${c.c}"></span>${esc(c.name)}`;
    b.onclick=()=>{ offCats.has(c.name)?offCats.delete(c.name):offCats.add(c.name); renderAll(); };
    r1.appendChild(b);
  });
  const r2 = document.createElement("div"); r2.className="legrow";
  r2.innerHTML = '<span class="leglabel">対象</span>';
  TGTS.filter(t=>EVENTS.some(e=>e.g===t.name)).forEach(t=>{
    const b=document.createElement("span");
    b.className="chip tgt"+(offTgts.has(t.name)?" off":"");
    b.style.borderColor=t.c; b.style.color=t.c;
    b.textContent=t.name;
    b.onclick=()=>{ offTgts.has(t.name)?offTgts.delete(t.name):offTgts.add(t.name); renderAll(); };
    r2.appendChild(b);
  });
  L.appendChild(r1); L.appendChild(r2);
}

// ============================================================
// 【月ナビゲーション】月切替タブ（10月、11月など）と前月/次月ボタン
// ============================================================
/** @type {string[]} */
let MONTHS = [];
function renderTabs(){
  // タブ領域を毎回空にすることで、データ再描画時に前回分のボタンが残るのを防ぐ。
  // 各ボタンには元の年月（YYYY-MM）を保持し、表示文字だけを「N月」にする。
  const T=document.getElementById("mtabs"); T.innerHTML="";
  MONTHS.forEach(m=>{
    const b=document.createElement("button");
    b.className="mtab"+(m===curMonth?" active":"");
    // 年をまたぐ場合もタブには月だけを表示し、前年・翌年の判別をユーザー操作に混ぜない。
    b.textContent = `${Number(m.slice(5))}月`;
    // 同じ年月タブが選択されたときだけカレンダーと一覧を再描画し、表示月を切り替える。
    b.onclick=()=>{ curMonth=m; renderAll(); };
    T.appendChild(b);
  });
}
/** @param {number} d 前月なら-1、次月なら1 */
function shiftMonth(d){
  // 前月ボタンは-1、次月ボタンは+1として実際に存在するMONTHSの位置へ移動する。
  // 範囲外なら移動せず、そのまま現在の表示月を維持する。
  const i=MONTHS.indexOf(curMonth)+d;
  if(i>=0 && i<MONTHS.length){ curMonth=MONTHS[i]; renderAll(); }
}
document.getElementById("prevM").onclick=()=>shiftMonth(-1);
document.getElementById("nextM").onclick=()=>shiftMonth(1);

// ============================================================
// 【カード生成】カレンダーマス内の行事カード・長期帯のHTML組み立て
// ============================================================
/**
 * @param {CalendarEvent} e
 * @param {string} label
 * @param {string|null} timestr
 * @returns {string} 行事カードのHTML
 */
function cardHTML(e, label, timestr){
  const c=catOf(e.c), koen=e.c==="ご講演";
  const {p,icon}=placeInfo(e);
  const t = timestr ? `<span class="tm">${esc(timestr)}</span>` : "";
  const loc = p ? `<span class="lc">${icon}${esc(p)}${e.pd?"　"+esc(e.pd):""}</span>` : (e.pd?`<span class="lc">${esc(e.pd)}</span>`:"");
  const tg = (e.g && e.g!=="学徒全員") ? `<span class="tg" style="border-color:${tgtOf(e.g).c};color:${tgtOf(e.g).c}">${esc(e.g)}</span>` : "";
  return `<div class="ev${koen?" koen":""}" data-i="${e.i}" style="background:${c.bg};border-color:${c.c};color:${c.c}">${t}<span class="nm">${esc(label||e.t)}</span>${tg}${loc}</div>`;
}
/**
 * @param {CalendarEvent} e
 * @param {string} day YYYY-MM-DD形式の日付
 * @returns {{label: string, time: string|null}|null} 指定日の表示内容
 */
function labelFor(e, day){
  const span=spanDays(e);
  if(span<=1) return {label:e.t, time:e.st?`${e.st}〜${e.et||""}`.replace(/〜$/,""):null};
  if(span===2){
    if(day===e.s) return {label:e.t+"（初日）", time:e.st?`${e.st}〜`:null};
    if(day===e.e) return {label:e.t+"（最終日）", time:e.et?`〜${e.et}`:null};
  }
  return null;
}

// ============================================================
// 【カレンダー表示】横画面・PC用の月間カレンダーグリッド描画
// ============================================================
// 当日の日付（YYYY-MM-DD）
const TODAY = iso(new Date());
function renderCal(){
  const G=document.getElementById("grid"); G.innerHTML="";
  const D=document.getElementById("dowrow");
  if(!D.children.length) WK.forEach((w,i)=>{ const x=document.createElement("div"); x.className="dow"+(i===6?" sun":""); x.textContent=w; D.appendChild(x); });
  const [y,m]=curMonth.split("-").map(Number);
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const lead=(first.getDay()+6)%7;
  const cells=[];
  for(let i=0;i<lead;i++){ const d=new Date(first); d.setDate(d.getDate()-(lead-i)); cells.push({d,dim:true}); }
  for(let d=1; d<=last.getDate(); d++) cells.push({d:new Date(y,m-1,d),dim:false});
  while(cells.length%7!==0){ const d=new Date(cells[cells.length-1].d); d.setDate(d.getDate()+1); cells.push({d,dim:true}); }
  const byDay={};
  cells.forEach(c=>{ byDay[iso(c.d)]=[]; });
  EVENTS.forEach(e=>{ if(!visible(e)) return;
    if(isPeriod(e)) return;
    if(spanDays(e)===2){
      [e.s,e.e].forEach(day=>{ if(byDay[day]) byDay[day].push(e); });
    } else if(byDay[e.s]) byDay[e.s].push(e);
  });
  cells.forEach(c=>{
    const key=iso(c.d);
    const cell=document.createElement("div");
    cell.className="cell"+(c.dim?" dim":"")+(key===TODAY?" today":"");
    cell.innerHTML=`<div class="dnum">${c.dim?(c.d.getMonth()+1)+"/":""}${c.d.getDate()}</div>`;
    if(c.dim){ G.appendChild(cell); return; }
    /* period bars */
    EVENTS.filter(e=>isPeriod(e)&&visible(e)&&e.s<=key&&key<=e.e).forEach(e=>{
      const cc=catOf(e.c);
      const bar=document.createElement("div");
      bar.className="bar"+(e.s===key?" bstart":"")+(e.e===key?" bend":"");
      bar.style.background=cc.c; bar.dataset.i=e.i;
      cell.appendChild(bar);
      if(e.s===key || c.d.getDay()===1){
        const nm=document.createElement("div");
        nm.className="barname"; nm.style.color=cc.c; nm.dataset.i=e.i;
        nm.textContent=`${e.t}（${mdLabel(e.s)}〜${mdLabel(e.e)}）`;
        cell.appendChild(nm);
      }
    });
    byDay[key].sort(byTime).forEach(e=>{
      const lf=labelFor(e,key)||{label:e.t,time:e.st};
      const div=document.createElement("div");
      div.innerHTML=cardHTML(e,lf.label,lf.time);
      cell.appendChild(div.firstChild);
    });
    G.appendChild(cell);
  });
}

// ============================================================
// 【リスト表示】スマホ縦画面用の日付順ブロック一覧描画
// ============================================================
function renderList(){
  const L=document.getElementById("listView"); L.innerHTML="";
  const [y,m]=curMonth.split("-").map(Number);
  const last=new Date(y,m,0).getDate();
  const todayKey=TODAY;
  for(let d=1; d<=last; d++){
    const key=iso(new Date(y,m-1,d));
    const evs=EVENTS.filter(e=>visible(e)&&!isPeriod(e)&&(spanDays(e)===2?(e.s===key||e.e===key):e.s===key))
      .sort(byTime);
    const pers=EVENTS.filter(e=>isPeriod(e)&&visible(e)&&e.s<=key&&key<=e.e);
    if(!evs.length && !pers.length) continue;
    const blk=document.createElement("div"); blk.className="dayblock";
    pers.forEach(e=>{
      const cc=catOf(e.c);
      const st = (todayKey>=e.s && todayKey<=e.e) ? "開催中" : "開催予定";
      const pb=document.createElement("div");
      pb.className="pbar"; pb.style.background=cc.bg; pb.style.color=cc.c; pb.dataset.i=e.i;
      pb.innerHTML=`<span class="vlabel">${st}</span><span class="vname">${esc(e.t)} ${mdLabel(e.s)}〜${mdLabel(e.e)}</span>`;
      blk.appendChild(pb);
    });
    const w=wkLabel(key), sun=dObj(key).getDay()===0;
    const body=document.createElement("div");
    blk.insertAdjacentHTML("beforeend",
      `<div class="dhead"><div class="md">${m}/${d}</div><div class="wk${sun?" sun":""}">${w}</div></div>`);
    body.className="dbody";
    evs.forEach(e=>{
      const lf=labelFor(e,key)||{label:e.t,time:e.st};
      const c=catOf(e.c), koen=e.c==="ご講演";
      const {p,icon}=placeInfo(e);
      const g=e.g?`<span class="tagchip" style="color:${tgtOf(e.g).c};border-color:${tgtOf(e.g).c}">${esc(e.g)}</span>`:"";
      const div=document.createElement("div");
      div.className="lev"+(koen?" koen":"");
      div.style.background=c.bg; div.style.borderColor=c.c; div.style.color=c.c;
      div.dataset.i=e.i;
      div.innerHTML=`${lf.time?`<span class="tm">${esc(lf.time)}</span>`:""}<span class="nm">${esc(lf.label)}</span>`+
        `<div class="meta">${g}${p?` ${icon}${esc(p)}${e.pd?"　"+esc(e.pd):""}`:(e.pd?esc(e.pd):"")}</div>`;
      body.appendChild(div);
    });
    if(!evs.length) body.innerHTML='<div class="noev">行事カードなし（期間行事のみ）</div>';
    blk.appendChild(body);
    L.appendChild(blk);
  }
  if(!L.children.length) L.innerHTML='<div class="noev">この月の行事はありません</div>';
}

// ============================================================
// 【詳細ポップアップ】行事タップ時のモーダルダイアログ表示
// ============================================================
const OV=document.getElementById("overlay"), MD=document.getElementById("modal");
function openModal(idx, anchorEl){
  const e=EVENTS.find(x=>x.i===idx); if(!e) return;
  const c=catOf(e.c), {p,icon}=placeInfo(e);
  const span=spanDays(e);
  let when;
  if(span===1) when=`${mdLabel(e.s)}（${wkLabel(e.s)}）`+(e.st?` ${e.st}〜${e.et||""}`.replace(/〜$/,""):"");
  else when=`${mdLabel(e.s)}（${wkLabel(e.s)}）〜${mdLabel(e.e)}（${wkLabel(e.e)}）`+
    (e.st?`　${e.s===e.e?"":"初日 "+e.st+"〜"}`:"")+(e.et?` 最終日 〜${e.et}`:"");
  MD.innerHTML=`<h2>${esc(e.t)}</h2>`+
    `<div class="row"><span class="tagchip" style="background:${c.bg};color:${c.c};border-color:${c.c}">${esc(e.c)}</span>`+
    (e.g?`<span class="tagchip" style="color:${tgtOf(e.g).c};border-color:${tgtOf(e.g).c}">${esc(e.g)}</span>`:"")+`</div>`+
    `<div class="row"><span class="lbl">日時</span>${esc(when)}</div>`+
    (p?`<div class="row"><span class="lbl">場所</span>${icon} ${esc(p)}${e.pd?"　"+esc(e.pd):""}</div>`:(e.pd?`<div class="row"><span class="lbl">場所</span>${esc(e.pd)}</div>`:""))+
    (e.ha&&e.ha.length?`<div class="row"><span class="lbl">担当</span>${esc(e.ha.join("、"))}</div>`:"")+
    (e.ot?`<div class="row"><span class="lbl">正式名</span>${esc(e.ot)}</div>`:"")+
    (e.d?`<div class="row"><span class="lbl">説明</span>${esc(e.d).replace(/\n/g,"<br>")}</div>`:"")+
    (e.u?`<div class="row"><span class="lbl">URL</span><a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.u)}</a></div>`:"")+
    `<button id="mclose">閉じる</button>`;
  OV.classList.add("on");
  /* Notion埋め込み(iframe)ではfixedが効かないため、タップしたカード付近にabsoluteで表示する */
  const sy = window.scrollY || window.pageYOffset || 0;
  let top;
  if(anchorEl && anchorEl.getBoundingClientRect){ top = anchorEl.getBoundingClientRect().top + sy; }
  else { top = sy + 24; }
  if(top < sy + 12) top = sy + 12;
  MD.style.top = top + "px";
  MD.scrollTop = 0;
  document.getElementById("mclose").onclick=()=>OV.classList.remove("on");
}
OV.onclick=ev=>{ if(ev.target===OV) OV.classList.remove("on"); };
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-i]");
  if(t) openModal(Number(t.dataset.i), t);
});

// ============================================================
// 【レスポンシブ判定】画面幅に応じたカレンダー／リスト切替
// ============================================================
function applyOrientation(){
  /* 幅ベース判定: 狭い画面(スマホ縦)は一覧、広い画面(PC・スマホ横)はカレンダー。
     Notion埋め込みiframe内では orientation メディアクエリが端末の縦横を反映しないため幅で判定する。 */
  const wide=window.innerWidth>=640;
  document.body.classList.toggle("land",wide);
}
window.addEventListener("resize",applyOrientation);
window.addEventListener("orientationchange",applyOrientation);

function renderAll(){ renderLegend(); renderTabs(); renderCal(); renderList(); }

// events.jsonを非同期で読み込み、イベントと更新時刻を取得して画面を初期化する。
/**
 * events.jsonを取得し、カレンダー画面を初期化する。
 * @returns {Promise<void>}
 */
async function loadCalendarData() {
  try {
    // ブラウザキャッシュではなくサーバー上の最新ファイルを読む。
    // GitHub Pagesへ更新直後でも古いevents.jsonが表示される可能性を下げる。
    const eventsResponse = await fetch("events.json", { cache: "no-store" });

    if (!eventsResponse.ok) {
      throw new Error(`イベントデータの読み込みに失敗しました: ${eventsResponse.status}`);
    }

    // events.jsonは更新時刻とイベント配列を持つオブジェクトなので、
    // events配列が存在しない不正な内容では空配列として扱う。
    /** @type {CalendarData} */
    const calendarData = await eventsResponse.json();
    EVENTS = Array.isArray(calendarData.events) ? calendarData.events : [];
    LAST_UPDATED = calendarData.lastUpdated || "";
  } catch (error) {
    // ネットワーク障害やJSON形式不正でも、コンソールへ原因を残す。
    // エラー時のEVENTSは先頭の空配列を維持し、画面全体が停止しないようにする。
    console.error("カレンダーデータの読み込みに失敗しました:", error);
  }

  // データの読み込み成否にかかわらず、フッターとカレンダー・一覧の初期描画を実行する。
  __boot();
}

loadCalendarData();
</script>
