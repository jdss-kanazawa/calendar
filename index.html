  .months{display:flex; gap:6px;}
  .months button{

  .months button:hover{background:var(--soft2);}
  .months button.active{background:var(--text); color:#fff; border-color:var(--text);}

  .legend .item{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text2); cursor:pointer; user-select:none; padding:4px 8px; border-radius:6px; border:1px solid transparent;}

  .legend .item.off{opacity:.35;}
  .fgroup{display:flex; align-items:flex-start; gap:8px;}
  .flabel{font-size:12px; font-weight:700; color:var(--text2); flex:none; padding-top:5px; width:34px;}
  .addnote{margin-top:14px; padding:12px 14px; border:1px solid var(--blue); border-radius:10px; background:var(--blue-soft); font-size:13px; line-height:1.7; color:var(--text);}
  .addnote a{color:var(--blue); font-weight:700; text-decoration:underline;}
  .fnote{font-size:12px; color:var(--text2); background:var(--soft); border-radius:7px; padding:6px 10px; margin-bottom:2px;}

  .grid{display:grid; grid-template-columns:repeat(7,1fr);}

  .cell .dnum{font-size:12.5px; font-weight:600; color:var(--text2); margin-bottom:4px;}
  .cell.today .dnum{background:var(--blue); color:#fff; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;}
  .cell.sun .dnum{color:var(--red);} .cell.sat .dnum{color:var(--blue);}

  .ev.green{background:var(--green-soft); color:#1f5c3d; border-left-color:var(--green);}
  .ev.red{background:var(--red-soft); color:#8f2f27; border-left-color:var(--red);}

  .ev.lecture .en{font-size:15px; font-weight:800; line-height:1.25;}
  .ev.lecture .ep{font-size:12px;}
  .li.lecture{background:var(--red-soft);}
  .li.lecture .bar{width:6px;}
  .li.lecture .nm{font-size:16px; font-weight:800;}
  .li.lecture .time{font-weight:700; color:#8f2f27;}
  .ev .et{display:block; font-size:10.5px; font-weight:600; opacity:.8; font-variant-numeric:tabular-nums;}
  .ev .en{display:block; font-size:12px; font-weight:700; margin:1px 0; word-break:break-word; white-space:normal;}
  .ev .ep{display:block; font-size:10.5px; opacity:.72; word-break:break-word; white-space:normal;}

  footer{margin-top:18px; text-align:center; color:var(--text2); font-size:12px;}

    .calview{display:none;}
    .listview{display:block;}

</style>

const WD = ["日","月","火","水","木","金","土"];
const jstFmt = new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short"});

function jstParts(iso){
  const p = jstFmt.formatToParts(new Date(iso));
  const o = {};
  for(const x of p){ o[x.type]=x.value; }
  return o; // year, month, day, hour, minute
}

// enrich events with jst date key + time text
EVENTS.forEach(e=>{
  if(e.allDay){
    e.key = e.start; // yyyy-mm-dd
    e.timeText = "終日";
  } else {
    const s = jstParts(e.start);
    e.key = s.year+"-"+s.month+"-"+s.day;
    let t = (+s.hour)+":"+s.minute;
    if(e.end){ const en = jstParts(e.end); t += "〜"+(+en.hour)+":"+en.minute; }
    e.timeText = t;
    e.sortH = parseInt(s.hour)*60+parseInt(s.minute);
  }
});

const MONTHS = [
  {y:2026, m:7, label:"7月"},
  {y:2026, m:8, label:"8月"},
  {y:2026, m:9, label:"9月"}
];
let curMonth = 0;
const disabledCat = new Set(); const disabledTarget = new Set();
const todayKey = (()=>{ const t=jstParts(new Date().toISOString()); return t.year+"-"+t.month+"-"+t.day; })();

function evVisible(e){ return !disabledCat.has(e.cat) && !disabledTarget.has(e.target); }
function keyFor(y,m,d){ return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function eventsOn(key){
  return EVENTS.filter(e=>e.key===key && evVisible(e))
    .sort((a,b)=>{ if(a.allDay&&!b.allDay)return -1; if(!a.allDay&&b.allDay)return 1; return (a.sortH||0)-(b.sortH||0); });
}

function renderMonthsNav(){
  const c = document.getElementById("months"); c.innerHTML="";
  MONTHS.forEach((mo,i)=>{
    const b=document.createElement("button");
    b.textContent=mo.label; if(i===curMonth)b.className="active";
    b.onclick=()=>{curMonth=i; renderAll();};
    c.appendChild(b);
  });
}

function renderCalendar(){
  const {y,m} = MONTHS[curMonth];
  const grid = document.getElementById("grid"); grid.innerHTML="";
  const first = new Date(Date.UTC(y,m-1,1));
  const startDow = (first.getUTCDay()+6)%7;
  const daysInMonth = new Date(Date.UTC(y,m,0)).getUTCDate();
  for(let i=0;i<startDow;i++){ const c=document.createElement("div"); c.className="cell pad"; grid.appendChild(c);}  
  for(let d=1; d<=daysInMonth; d++){
    const key = keyFor(y,m,d);
    const dow = new Date(Date.UTC(y,m-1,d)).getUTCDay();
    const cell=document.createElement("div"); cell.className="cell";
    if(dow===0)cell.classList.add("sun"); if(dow===6)cell.classList.add("sat");
    if(key===todayKey)cell.classList.add("today");
    const dn=document.createElement("div"); dn.className="dnum"; dn.textContent=d; cell.appendChild(dn);
    eventsOn(key).forEach(e=>{
      const b=document.createElement("button"); b.className="ev "+catCls(e)+(e.cat==="ご講演"?" lecture":"");
      let h="";
      h+="<span class='et'>"+(e.allDay?"終日":esc(e.timeText))+"</span>";
      h+="<span class='en'>"+esc(e.n)+"</span>";
      { const pd=placeDisp(e); if(pd){ h+="<span class='ep'>"+placeIcon(e)+" "+esc(pd)+"</span>"; } }
      h+=tagHtml(e);
      b.innerHTML=h;
      b.onclick=()=>openModal(e); cell.appendChild(b);
    });
    grid.appendChild(cell);
  }
  const total = startDow+daysInMonth; const rem=(7-(total%7))%7;
  for(let i=0;i<rem;i++){ const c=document.createElement("div"); c.className="cell pad"; grid.appendChild(c);}  
}

function renderList(){
  const {y,m}=MONTHS[curMonth];
  const lv=document.getElementById("listview"); lv.innerHTML="";
  const daysInMonth=new Date(Date.UTC(y,m,0)).getUTCDate();
  let any=false;
  for(let d=1; d<=daysInMonth; d++){
    const key=keyFor(y,m,d); const evs=eventsOn(key);
    if(!evs.length)continue; any=true;
    const dow=new Date(Date.UTC(y,m-1,d)).getUTCDay();
    const g=document.createElement("div"); g.className="day-group";
    const h=document.createElement("div"); h.className="day-head";
    h.innerHTML="<span>"+m+"/"+d+"</span><span class='wd'>("+WD[dow]+")</span>";
    g.appendChild(h);
    evs.forEach(e=>{
      const li=document.createElement("div"); li.className="li"+(e.cat==="ご講演"?" lecture":""); li.onclick=()=>openModal(e);
      const pd=placeDisp(e); const pm=pd?"<div class='meta'>"+placeIcon(e)+" "+esc(pd)+"</div>":"";
      li.innerHTML="<div class='bar "+catCls(e)+"'></div><div class='time'>"+esc(e.timeText)+"</div><div style='flex:1'><div class='nm'>"+esc(e.n)+"</div>"+pm+tagHtml(e)+"</div>";
      g.appendChild(li);
    });
    lv.appendChild(g);
  }
  if(!any){ lv.innerHTML="<div class='empty'>表示できる行事がありません</div>"; }
}

function openModal(e){
  const cm=CATMAP[e.cat]||{cls:"gray",label:e.cat};
  let rows="";
  rows+="<div class='row'><div class='k'>日時</div><div class='v'>"+esc(monthDayText(e))+"　"+esc(e.timeText)+"</div></div>";
  { const pd=placeDisp(e); if(pd){ rows+="<div class='row'><div class='k'>場所</div><div class='v'>"+placeIcon(e)+" "+esc(pd)+(e.placeDetail?"（"+esc(e.placeDetail)+"）":"")+"</div></div>"; } }
  if(e.staff){ rows+="<div class='row'><div class='k'>担当</div><div class='v'>"+esc(e.staff)+"</div></div>"; }
  rows+="<div class='row'><div class='k'>対象</div><div class='v'><span class='tag "+((TARGETMAP[e.target]||{cls:'gray'}).cls)+"'>"+esc(e.target)+"</span></div></div>";
  if(e.url){ rows+="<div class='row'><div class='k'>URL</div><div class='v'><a href='"+e.url+"' target='_blank' rel='noopener'>"+esc(e.url)+"</a></div></div>"; }
  if(e.desc){ rows+="<div class='row'><div class='k'>説明</div><div class='v'>"+esc(e.desc)+"</div></div>"; }
  const mo=document.getElementById("modal");
  mo.innerHTML="<div class='mh'><span class='cat "+cm.cls+"'>"+cm.label+"</span><button class='close' onclick='closeModal()'>✕</button><h2>"+esc(e.n)+"</h2></div><div class='rows'>"+rows+"</div>";
  document.getElementById("overlay").classList.add("on");
}
function closeModal(){ document.getElementById("overlay").classList.remove("on"); }
function monthDayText(e){ const p=e.key.split("-"); const dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); return (+p[1])+"月"+(+p[2])+"日("+WD[dt.getUTCDay()]+")"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function catCls(e){ return (CATMAP[e.cat]||{cls:"gray"}).cls; }
function tagHtml(e){ const t=TARGETMAP[e.target]||{cls:"gray"}; return "<span class='tags'><span class='tag "+t.cls+"'>"+esc(e.target)+"</span></span>"; }
function hasStream(p){ return /オンライン|zoom|配信|ライブ|live|youtube/i.test(p||""); }
function placeIcon(e){ return (e.place && !hasStream(e.place)) ? "🏫" : "📡"; }
function placeDisp(e){ if(!e.place) return e.live?"配信":""; return (e.live && !hasStream(e.place)) ? e.place+"（配信）" : e.place; }

function buildLegend(containerId, order, map, disabledSet, getVal, chipClass){
  const present = order.filter(name=>EVENTS.some(e=>getVal(e)===name));
  const c=document.getElementById(containerId); c.innerHTML="";
  present.forEach(name=>{
    const m=map[name]||{cls:"gray"};
    const el=document.createElement("div"); el.className="item"; el.title="クリックで表示/非表示";
    el.innerHTML="<span class='"+chipClass+" "+m.cls+"'>"+esc(name)+"</span>";
    el.onclick=()=>{ if(disabledSet.has(name)){disabledSet.delete(name); el.classList.remove("off");} else {disabledSet.add(name); el.classList.add("off");} renderAll(); };
    c.appendChild(el);
  });
}
buildLegend("legendCat", CAT_ORDER, CATMAP, disabledCat, e=>e.cat, "legcat");
buildLegend("legendTarget", TARGET_ORDER, TARGETMAP, disabledTarget, e=>e.target, "tag");
document.getElementById("overlay").onclick=(ev)=>{ if(ev.target.id==="overlay")closeModal(); };
document.addEventListener("keydown",(ev)=>{ if(ev.key==="Escape")closeModal(); });

function renderAll(){ renderMonthsNav(); renderCalendar(); renderList(); }
renderAll();
